name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  connector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint -- -c .eslintrc.prepublish.js
      - run: npm test
      - run: npm pack --dry-run
