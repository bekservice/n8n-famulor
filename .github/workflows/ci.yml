name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  connector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The dev SDK includes a Node 22-only native VM. These connector tests do
      # not execute that VM; n8n supplies its own runtime. Keep the Node 20
      # compatibility tests without running unrelated dependency build hooks.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint -- -c .eslintrc.prepublish.js
      - run: npm test
      - run: npm pack --dry-run
